[package]
name = "svp-server"
description = "svp server binary: runs the aggregator and serves its clients the svp protocol over a Unix socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "svp"
path = "src/main.rs"

[dependencies]
svp-transport = { workspace = true }
svp-wire = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
nautilus-binance = { workspace = true }
nautilus-bybit = { workspace = true }
nautilus-coinbase = { workspace = true }
nautilus-common = { workspace = true }
nautilus-core = { workspace = true }
nautilus-hyperliquid = { workspace = true }
nautilus-kraken = { workspace = true }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-okx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
svp-client = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true }

[lints]
workspace = true
