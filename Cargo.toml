[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo run` runs the server.
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/sbOogway/svp"
authors = ["Mattia Papaccioli (sbOogway)"]

[workspace.dependencies]
svp-common = { path = "crates/common" }
svp-client = { path = "crates/client" }

anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
log = "0.4"
# Nautilus is pinned exactly: its Rust API changes between the ~biweekly releases.
nautilus-binance = "=0.64.0"
nautilus-bybit = "=0.64.0"
nautilus-coinbase = "=0.64.0"
nautilus-common = "=0.64.0"
nautilus-core = "=0.64.0"
nautilus-hyperliquid = "=0.64.0"
nautilus-kraken = "=0.64.0"
nautilus-live = "=0.64.0"
nautilus-model = "=0.64.0"
nautilus-okx = "=0.64.0"
rmp-serde = "1"
# Nautilus converts its prices and sizes to it exactly.
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
